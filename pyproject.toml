[project]
name = "krs-verify"
version = "0.1.0"
description = "MCP server: weryfikacja podmiotów KRS z oficjalnego API MS i Białej Listy VAT MF"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2",
    "httpx>=0.27",
]

[project.scripts]
krs-verify = "krs_verify.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["krs_verify"]
